name: Release

on:
  release:
    types: published

permissions:
  contents: read

jobs:
  ci:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/triggon

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
